{% extends 'base.html' %}

{% block title %}
{{ title }} - MyStore
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>{{ title }}</h1>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            Save
        </button>

        <a
            href="{% url 'product_list' %}"
            class="cancel-btn"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
