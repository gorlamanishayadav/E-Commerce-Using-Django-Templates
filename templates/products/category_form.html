{% extends 'base.html' %}

{% block title %}
{{ title }} - MyStore
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>{{ title }}</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            Save Category
        </button>

        <a
            href="{% url 'category_list' %}"
            class="cancel-btn"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
