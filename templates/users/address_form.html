{% extends 'base.html' %}

{% block title %}Address - MyStore{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Address</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            Save Address
        </button>

        <a href="{% url 'profile' %}" class="cancel-btn">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
